<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications Settings — ProjectHub</title>
<link href="../dist/output.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

<!-- ============ NAVBAR ============ -->
<nav id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300">
  <div id="navShell" class="mx-3 mt-3 sm:mx-6 sm:mt-4 rounded-2xl transition-all duration-300 border border-slate-200/70 dark:border-white/10 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl shadow-lg shadow-slate-900/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <a href="../index.html" class="flex items-center gap-2.5 cursor-pointer group flex-shrink-0">
        <img src="../assets/logo.jpg" alt="ProjectHub Logo" class="w-10 h-10 rounded-xl object-cover shadow-lg shadow-violet-500/30 group-hover:rotate-6 group-hover:scale-105 transition-transform duration-300">
        <span class="hidden sm:inline font-extrabold text-lg tracking-tight">ProjectHub</span>
      </a>

      <!-- Right actions -->
      <div class="flex items-center gap-1.5 ml-auto">
        <button onclick="toggleTheme()" class="hidden sm:flex relative w-10 h-10 items-center justify-center rounded-xl text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10 hover:text-slate-900 dark:hover:text-white transition-colors overflow-hidden">
          <svg id="iconSun" class="w-5 h-5 absolute transition-all duration-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg id="iconMoon" class="w-5 h-5 absolute transition-all duration-500 opacity-0 scale-50 -rotate-90" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
        </button>

        <div id="profileTrigger" class="relative block">
          <button onclick="togglePanel('profilePanel')" class="flex items-center gap-2 pl-1 pr-2 py-1 rounded-xl hover:bg-slate-100 dark:hover:bg-white/10 transition-colors">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-fuchsia-500 to-blue-600 flex items-center justify-center text-white text-xs font-bold shadow-md shadow-fuchsia-500/20">JD</div>
            <svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div id="profilePanel" class="hidden absolute right-0 top-full mt-3 w-52 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl z-50 p-2">
            <a href="../html/profile.html" class="block px-3 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">My Profile</a>
            <a href="../html/my-projects.html" class="block px-3 py-2.5 rounded-xl text-sm font-medium hover:bg-slate-50 dark:hover:bg-white/5 transition-colors">My Projects</a>
            <a href="../html/settings.html" class="block px-3 py-2.5 rounded-xl text-sm font-medium bg-slate-50 dark:bg-white/5 text-violet-600 dark:text-violet-400">Settings</a>
            <hr class="my-1.5 border-slate-100 dark:border-slate-800">
            <a href="../index.html" class="block w-full text-left px-3 py-2.5 rounded-xl text-sm font-medium text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10 transition-colors">Logout</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- ============ SETTINGS DASHBOARD ============ -->
<section class="pt-32 pb-20 px-4 sm:px-6 lg:px-8 min-h-screen relative overflow-hidden">
  <div class="absolute -top-20 -left-20 w-96 h-96 bg-fuchsia-400/10 dark:bg-fuchsia-600/5 rounded-full blur-3xl -z-10"></div>
  
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-8">
    
    <!-- Sidebar Menu -->
    <aside class="w-full md:w-64 flex-shrink-0 reveal show">
      <h1 class="text-3xl font-extrabold mb-6">Settings</h1>
      <nav class="space-y-1">
        <a href="settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          Account
        </a>
        <a href="settings-notifications.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-bold bg-white dark:bg-slate-900 border border-violet-200 dark:border-violet-500/30 text-violet-600 dark:text-violet-400 shadow-sm transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          Notifications
        </a>
        <a href="settings-security.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          Security
        </a>
        <a href="settings-billing.html" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/5 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>
          Billing & Plans
        </a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 space-y-6 reveal show" style="animation-delay: 0.1s;">
      
      <div class="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-100 dark:border-slate-800 shadow-sm relative overflow-hidden">
        <div class="absolute top-0 right-0 w-32 h-32 bg-fuchsia-400/10 dark:bg-fuchsia-600/10 rounded-full blur-2xl"></div>
        <h2 class="text-xl font-bold mb-1">Email Notifications</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Choose what updates you want to receive via email.</p>
        
        <div class="space-y-4">
          
          <label class="flex items-start gap-4 cursor-pointer p-4 rounded-2xl hover:bg-slate-50 dark:hover:bg-white/5 transition-colors border border-transparent hover:border-slate-100 dark:hover:border-slate-800">
            <div class="relative inline-flex items-center mt-1">
              <input type="checkbox" class="sr-only peer" checked>
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-violet-300 dark:peer-focus:ring-violet-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-violet-500"></div>
            </div>
            <div>
              <p class="font-bold text-sm">Product Updates</p>
              <p class="text-xs text-slate-500 mt-1">Get the latest news about features and improvements.</p>
            </div>
          </label>

          <label class="flex items-start gap-4 cursor-pointer p-4 rounded-2xl hover:bg-slate-50 dark:hover:bg-white/5 transition-colors border border-transparent hover:border-slate-100 dark:hover:border-slate-800">
            <div class="relative inline-flex items-center mt-1">
              <input type="checkbox" class="sr-only peer" checked>
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-violet-300 dark:peer-focus:ring-violet-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-violet-500"></div>
            </div>
            <div>
              <p class="font-bold text-sm">Comments & Likes</p>
              <p class="text-xs text-slate-500 mt-1">Be notified when someone engages with your projects.</p>
            </div>
          </label>
          
          <label class="flex items-start gap-4 cursor-pointer p-4 rounded-2xl hover:bg-slate-50 dark:hover:bg-white/5 transition-colors border border-transparent hover:border-slate-100 dark:hover:border-slate-800">
            <div class="relative inline-flex items-center mt-1">
              <input type="checkbox" class="sr-only peer">
              <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-violet-300 dark:peer-focus:ring-violet-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-violet-500"></div>
            </div>
            <div>
              <p class="font-bold text-sm">Weekly Newsletter</p>
              <p class="text-xs text-slate-500 mt-1">A weekly digest of the top trending projects.</p>
            </div>
          </label>

        </div>
      </div>

    </main>
  </div>
</section>

<script src="./src/script.js"></script>
</body>
</html>
